events {}

http {
    server {
        listen 80;

       
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-API-Key' always;

      
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-API-Key';
            return 204;
        }
       

        location /drivers {
            proxy_pass http://driver-service:8080/drivers;
        }

        location /drivers/nearby {
            proxy_pass http://driver-service:8080/drivers/nearby;
        }

        location /health {
            proxy_pass http://driver-service:8080/health;
        }
    }
}
